services:
  postgres:
    image: postgres:16
    container_name: forge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - forge_pg_data:/var/lib/postgresql/data

volumes:
  forge_pg_data:
