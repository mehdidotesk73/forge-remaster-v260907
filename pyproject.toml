[project]
name = "forge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pytest>=7.4,<8.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]

[project.scripts]
forge-api = "forge.api.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge", "forge.*"]